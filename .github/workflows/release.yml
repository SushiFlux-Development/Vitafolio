name: Release

# Three channels are built and published; a development build is never tagged, built or published (it only runs locally).
#
#   Release  v2026.11.12                    public release     Docker: <version>, latest, beta, nightly
#   Beta     v2026.11.12.13.557-beta        public pre-release Docker: <version>, beta
#   Nightly  v2026.11.12.13.557-nightly     public pre-release Docker: <version>, nightly
#
# The tag must belong to the commit it sits on (scripts/release-meta.sh compares it with version.txt of that commit) and CHANGELOG.md must
# have the entry of this version in English and German (scripts/release-notes.sh); otherwise the run stops before anything is built or pushed.
# The title of the GitHub release is the readable version (five segments, the channel symbol in parentheses, scripts/version-display.sh);
# its text is only that entry of CHANGELOG.md.
#
# Docker image: ghcr.io/<owner>/<name> from "repository" in branding.json (lower case). Whoever pushes needs write access to that GHCR package. A package
# that was created by another repository (the repository before the history was restarted) keeps its link to that one: in the browser, in the
# settings of the package, give this repository write access before the first Beta/Nightly/Release run, otherwise the push is refused.
# Only the owner of the package can do this in the browser.
#
# Which targets are built is one line in the message of the annotated tag: "platform: unraid", "platform: windows-desktop" or "platform: all"
# (no line = all). The platform is never part of the tag name or of the release title.
#
# Order: facts and notes and the tests (ci.yml, called as a job; nothing below runs unless they passed) -> licence check -> Windows installer -> Docker image (the moving tags latest/beta/nightly only move when everything before
# was green) -> one release is created as a draft with all files, checked, and only then made public.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Check the tag and read the facts
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      version_short: ${{ steps.meta.outputs.version_short }}
      build_id: ${{ steps.meta.outputs.build_id }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      display: ${{ steps.meta.outputs.display }}
      template_tag: ${{ steps.meta.outputs.template_tag }}
      repository: ${{ steps.meta.outputs.repository }}
      docker_tags: ${{ steps.meta.outputs.docker_tags }}
      product: ${{ steps.meta.outputs.product }}
      company: ${{ steps.meta.outputs.company }}
      builds_unraid: ${{ steps.platform.outputs.builds_unraid }}
      builds_windows: ${{ steps.platform.outputs.builds_windows }}
      platform_label: ${{ steps.platform.outputs.label }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actions/checkout can flatten an annotated tag into a plain reference to its commit; the platform line lives in the tag's message
      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Read the facts of the tag
        id: meta
        run: |
          sh scripts/release-meta.sh "$GITHUB_REF_NAME" . > "$RUNNER_TEMP/meta.txt"
          cat "$RUNNER_TEMP/meta.txt"
          cat "$RUNNER_TEMP/meta.txt" >> "$GITHUB_OUTPUT"

      - name: Read the platform of the tag
        id: platform
        run: |
          sh scripts/release-platform.sh "$GITHUB_REF_NAME" . > "$RUNNER_TEMP/platform.txt"
          cat "$RUNNER_TEMP/platform.txt"
          cat "$RUNNER_TEMP/platform.txt" >> "$GITHUB_OUTPUT"

      - name: Extract the release notes from CHANGELOG.md
        run: |
          sh scripts/release-notes.sh "$GITHUB_REF_NAME" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Keep the release notes for the last job
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  # The same checks as on every push (ci.yml). Everything that builds or publishes depends on this job, directly or through "licenses".
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  licenses:
    name: Check the third-party licences
    needs: [inspect, tests]
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-fund --no-audit --prefix frontend
          dotnet restore Cv.slnx

      # Fails on an unknown or not allowed licence, on a licence the owner has not approved yet (--strict; scripts/license-policy.json), on a
      # missing licence text and when THIRD-PARTY-NOTICES.md is out of date (run scripts/build-notices.ps1 to renew it)
      - name: Check the licences
        run: node scripts/generate-third-party-notices.ts --check --strict

  windows:
    name: Build the Windows installer
    needs: [inspect, licenses]
    if: ${{ needs.inspect.outputs.builds_windows == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-fund --no-audit

      - name: Build the installer
        shell: powershell
        env:
          CHANNEL: ${{ needs.inspect.outputs.channel }}
        run: |
          if ($env:CHANNEL -eq 'beta') { .\scripts\build-windows.ps1 -Beta }
          elseif ($env:CHANNEL -eq 'nightly') { .\scripts\build-windows.ps1 -Nightly }
          else { .\scripts\build-windows.ps1 }

      # The program finds its update through the feed file of the release (UpdateChannels.PackageFeedName): releases.win.json for a release,
      # releases.beta.json for a beta, releases.nightly.json for a nightly
      - name: Check the installer files
        shell: powershell
        env:
          CHANNEL: ${{ needs.inspect.outputs.channel }}
          PRODUCT: ${{ needs.inspect.outputs.product }}
        run: |
          $feed = if ($env:CHANNEL -eq 'release') { 'releases.win.json' } else { "releases.$($env:CHANNEL).json" }
          $names = @(Get-ChildItem -LiteralPath artifacts\windows | ForEach-Object { $_.Name })
          Write-Host ($names -join "`n")
          if ($names -notcontains $feed) { throw "Die Update-Datei $feed fehlt." }
          if ($names -notcontains "$($env:PRODUCT)-win-Setup.exe") { throw 'Der Installer fehlt.' }
          if (-not ($names | Where-Object { $_ -like '*-full.nupkg' })) { throw 'Das Update-Paket (full.nupkg) fehlt.' }

      - name: Keep the Windows files for the last job
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: windows-release
          path: artifacts/windows/*
          if-no-files-found: error

  docker:
    name: Build and push the Docker image
    needs: [inspect, tests, licenses, windows]
    # Only after the Windows installer (when it is built at all) went through: the moving tags must not move for a half-finished release
    if: ${{ !cancelled() && needs.inspect.outputs.builds_unraid == 'true' && needs.tests.result == 'success' && needs.licenses.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the build date
        id: date
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # linux/amd64 only: the Typst engine ships a native library for linux-x64 and win-x64, not for arm64
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ needs.inspect.outputs.docker_tags }}
          build-args: |
            APP_TITLE=${{ needs.inspect.outputs.product }}
            APP_COMPANY=${{ needs.inspect.outputs.company }}
            REPOSITORY=${{ needs.inspect.outputs.repository }}
            APP_VERSION=${{ needs.inspect.outputs.version_short }}
            APP_VERSION_DETAIL=${{ needs.inspect.outputs.build_id }}
            APP_CHANNEL=${{ needs.inspect.outputs.channel }}
            IMAGE_TAG=${{ needs.inspect.outputs.image_tag }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.build_date }}

      - name: Render the Unraid template
        env:
          TEMPLATE_TAG: ${{ needs.inspect.outputs.template_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/unraid"
          sh scripts/render-unraid-template.sh "$TEMPLATE_TAG" . > "$RUNNER_TEMP/unraid/vitafolio.xml"

      - name: Keep the Unraid template for the last job
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: unraid-template
          path: ${{ runner.temp }}/unraid/vitafolio.xml
          if-no-files-found: error

  publish:
    name: Create the GitHub release
    needs: [inspect, tests, licenses, windows, docker]
    if: ${{ !cancelled() && needs.inspect.result == 'success' && needs.tests.result == 'success' && needs.licenses.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the notes and the built files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/files

      - name: Create the release as a draft with all files
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.inspect.outputs.tag }}
          name: ${{ needs.inspect.outputs.display }}
          body_path: ${{ runner.temp }}/files/release-notes/release-notes.md
          draft: true
          prerelease: ${{ needs.inspect.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: false
          files: |
            ${{ runner.temp }}/files/windows-release/*
            ${{ runner.temp }}/files/unraid-template/vitafolio.xml

      # Public only when everything that was meant to be built is attached; a draft is invisible to everybody else, including the update check
      - name: Check the files and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.inspect.outputs.tag }}
          CHANNEL: ${{ needs.inspect.outputs.channel }}
          PRODUCT: ${{ needs.inspect.outputs.product }}
          BUILDS_WINDOWS: ${{ needs.inspect.outputs.builds_windows }}
          BUILDS_UNRAID: ${{ needs.inspect.outputs.builds_unraid }}
        run: |
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          if [ "$BUILDS_WINDOWS" = "true" ]; then
            feed="releases.${CHANNEL}.json"
            [ "$CHANNEL" = "release" ] && feed="releases.win.json"
            echo "$assets" | grep -Fxq "$feed" || { echo "::error::The update file $feed is missing in the release."; exit 1; }
            echo "$assets" | grep -Fxq "${PRODUCT}-win-Setup.exe" || { echo "::error::The installer is missing in the release."; exit 1; }
          fi
          if [ "$BUILDS_UNRAID" = "true" ]; then
            echo "$assets" | grep -Fxq "vitafolio.xml" || { echo "::error::The Unraid template is missing in the release."; exit 1; }
          fi
          if [ "$CHANNEL" = "release" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,isDraft,isPrerelease,url --jq '"\(.name): draft=\(.isDraft) prerelease=\(.isPrerelease) \(.url)"'
